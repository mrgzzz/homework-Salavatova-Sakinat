<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея изображений</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 900px;
            margin: 20px auto;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        .prev, .next {
            position: absolute;
            top: 50%;
            color: white;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
        }
        .prev { left: 20px; }
        .next { right: 20px; }
    </style>
</head>
<body>
    <div class="gallery" id="gallery">
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <span class="prev">&#10094;</span>
        <span class="next">&#10095;</span>
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        const images = [
            "https://live.staticflickr.com/65535/52332817713_7b660f36b9_z.jpg",
            "https://i.pinimg.com/736x/19/ed/eb/19edeb3220e0b30a203d9812f9c9b98b.jpg",
            "https://i.pinimg.com/736x/78/0c/dc/780cdcc9fe2e921ddc52e31d0afea2ce.jpg",
            "https://azbyka.ru/wp-content/uploads/2016/07/priroda.jpg",
            "https://avatars.mds.yandex.net/get-yapic/26311/V10NaGWgxLPpEO2xbj2Q141Vv8-1/orig",
            "https://i.pinimg.com/736x/d5/99/be/d599bec3aedc11088715221c81b297b4.jpg"
        ];

        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.querySelector('.close');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');

        let currentIndex = 0;

        // Создаем галерею
        images.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Изображение ${index + 1}`;
            img.onclick = () => openLightbox(index);
            gallery.appendChild(img);
        });

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[index];
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        function showImage(direction) {
            currentIndex += direction;
            if (currentIndex >= images.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = images.length - 1;
            lightboxImg.src = images[currentIndex];
        }
        closeBtn.onclick = closeLightbox;
        prevBtn.onclick = () => showImage(-1);
        nextBtn.onclick = () => showImage(1);

        // Закрытие по клику на фон
        lightbox.onclick = (e) => {
            if (e.target === lightbox) closeLightbox();
        };

        // Управление клавиатурой
        document.onkeydown = (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showImage(-1);
            if (e.key === 'ArrowRight') showImage(1);
        };
    </script>
</body>
</html>
